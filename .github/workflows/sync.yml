name: Weekly menu sync

on:
  schedule:
    - cron: '17 18 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: menu-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Fetch and validate menu
        run: npm run sync
      - name: Commit successful snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/menu.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync party menu'
            git push
          fi
      - name: Report failure
        if: failure()
        run: |
          echo '## Menu sync failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect the failed step and logs. A failed fetch or validation does not replace the last successful snapshot.' >> "$GITHUB_STEP_SUMMARY"
